<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section class="parent">
        <section class="overlay">
            <section class="album-img">
                <img src="images/song1.jpg" alt="image" id="album-img">
            </section>

            <section class="song-details">
                <p class="song-name">Blinding Lights</p>                  
                <p class="song-author">The Weekend</p>  
            </section>      
            
            <section class="progress">
                <span id="current-time">00:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <span id="duration">00:00</span>
            </section>


            <section class="controls">
                <button id="previous-btn">⏮</button>
                <button id="play-btn" class="play-btn">▶</button>
                <button id="next-btn">⏭</button>
            </section>

            <section class="volume">
                <span>🔊</span>
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
            </section>

            <p id="status">Paused</p>
        </section>
    </section>
    <audio id="audio"></audio>
</body>
</html>
